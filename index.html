const _land=landing;landing=function(){const r=A('reviews').filter(x=>x.ok).sort((a,b)=>b.at-a.at).slice(0,6),ex=r.length?`<section class="sc rev"><h2>What customers say</h2><p class="sub">Real reviews from our users.</p><div class="grid g3">${r.map(x=>`<div class="fc"><b>${'\u2605'.repeat(x.rating)}</b><p>${esc(x.text)}</p><p style="margin-top:8px"><b>${esc(x.name)}</b></p></div>`).join('')}</div></section>`:'';return _land().replace('<section class="sc rev" id="faq"',ex+'<section class="sc rev" id="faq"').replace(`<button class="btn gh sm" onclick="pub='auth'`,`<button class="btn gh sm" onclick="appear()">Theme</button><button class="btn gh sm" onclick="pub='auth'`)};

/* ======== v3 part 4: login as user, referral map, teams, earn ======== */
Object.assign(TITLE,{earn:['Earn Money','Daily bonus, tasks, referrals and your team'],team:['My Team','Build a team and earn from their orders'],ateam:['Teams','All teams and their performance'],atask:['Earn Tasks','Create tasks and review submissions']});
Object.assign(P,{earn:'<circle cx="12" cy="12" r="9"/><path d="M14.5 9.5c-.5-1-1.500-1.500-2.500-1.500-1.500 0-2.500.8-2.500 2s1 1.800 2.500 2 2.500.8 2.500 2-1 2-2.500 2c-1 0-2-.5-2.500-1.500M12 6.500v1.500M12 16v1.500"/>',team:'<circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.500"/><path d="M3 20c0-3.500 2.500-5.500 6-5.500s6 2 6 5.500M15 14.800c3 0 6 1 6 4.200"/>'});P.ateam=P.team;P.atask=P.earn;
/* login as user (no password) */
function impAs(i){const u=usr(i);if(imp)return toast('Return to admin first');if(!u.id||u.role!=='user')return toast('You can only log in as a normal user');confirmD('Log in as @'+u.username+' without a password? This is logged.',()=>{imp=uid;SV('pf_imp',imp);logA('Admin logged in as '+u.username,'usr');uid=i;SV('pf_u',i);view='';bell=0;closeMod();render()})}
function impEnd(){if(!imp)return;uid=imp;imp='';SV('pf_imp','');SV('pf_u',uid);view='';render()}
/* referral map */
const kids=i=>A('users').filter(x=>x.refBy===i);
function rtree(i,d){const k=kids(i);if(!k.length||d>4)return'';return`<ul class="rtree">${k.map(x=>`<li><span class="node"><b>${esc(x.name)}</b> <span class="sub">@${esc(x.username)} \u00b7 joined ${day(x.at)} \u00b7 spent ${fm(spent(x.id))}</span></span>${rtree(x.id,d+1)}</li>`).join('')}</ul>`}
function lvlCount(i){const out=[];let cur=[i];for(let d=0;d<4;d++){const n=cur.flatMap(x=>kids(x).map(k=>k.id));if(!n.length)break;out.push(n.length);cur=n}return out}
const _ref=V.ref;V.ref=function(){const u=me(),by=u.refBy&&D.users[u.refBy],lv=lvlCount(u.id);return _ref()+card('Referral map',`<p class="sub">${by?'You joined through @'+esc(by.username)+'. ':''}${lv.length?lv.map((n,k)=>'Level '+(k+1)+': '+n).join(' \u00b7 '):'Nobody has joined with your code yet.'}</p><span class="node"><b>You</b> <span class="sub">@${esc(u.username)}</span></span>${rtree(u.id,1)||''}`)};
const _aaff=V.aaff;V.aaff=function(){const roots=A('users').filter(u=>u.role!=='admin'&&kids(u.id).length&&(!u.refBy||!D.users[u.refBy]));return _aaff()+card('Referral map (all networks)',roots.map(r=>`<div style="margin-bottom:12px"><span class="node"><b>${esc(r.name)}</b> <span class="sub">@${esc(r.username)} \u00b7 ${lvlCount(r.id).reduce((a,b)=>a+b,0)} people</span></span>${rtree(r.id,1)}</div>`).join('')||'<p class="sub">No referral networks yet.</p>')};
/* teams */
const myTeam=u=>u.team&&D.teams&&D.teams[u.team]?{...D.teams[u.team],id:u.team}:null,teamSpend=t=>sum(Object.keys(t.members||{}).map(spent));
async function teamComm(u,cost,n){const t=myTeam(u),p=+S3('teamPct',0);if(!t||t.owner===u.id||!(p>0)||!D.users[t.owner])return;const b=cost*p/100;await wal(t.owner,b,'team','Team commission from @'+u.username+' (order #'+n+')','refb');await db.ref('teams/'+t.id+'/earned').transaction(x=>(x||0)+b);notify(t.owner,'referrals','Team commission','You earned '+fm(b)+' from @'+u.username)}
async function teamNew(){const u=me(),n=$('#tn1').value.trim();if(u.team)return toast('You are already in a team');if(n.length<3||n.length>30)return toast('Team name must be 3\u201330 characters');const i=id();await W('teams/'+i,{name:n,owner:u.id,code:Math.random().toString(36).slice(2,8).toUpperCase(),at:Date.now(),members:{[u.id]:true},earned:0});await W('users/'+u.id+'/team',i);hist(u.id,'Created team '+n);toast('Team created');render()}
async function teamJoin(){const u=me(),c=$('#tj1').value.trim().toUpperCase(),t=A('teams').find(x=>x.code===c);if(u.team)return toast('You are already in a team');if(!t)return toast('Team code not found');if(Object.keys(t.members||{}).length>=+S3('teamMax',20))return toast('This team is full');await W('teams/'+t.id+'/members/'+u.id,true);await W('users/'+u.id+'/team',t.id);notify(t.owner,'referrals','New team member','@'+u.username+' joined your team '+t.name);hist(u.id,'Joined team '+t.name);toast('Joined '+t.name);render()}
async function disband(t){for(const m of Object.keys(t.members||{}))await W('users/'+m+'/team',null);await Rm('teams/'+t.id);logA('Team '+t.name+' disbanded','usr');toast('Team disbanded');render()}
function teamLeave(){const u=me(),t=myTeam(u);if(!t)return;const own=t.owner===u.id;confirmD(own?'You are the leader. Leaving will disband the team for everyone. Continue?':'Leave team '+t.name+'?',async()=>{if(own)return disband(t);await Rm('teams/'+t.id+'/members/'+u.id);await W('users/'+u.id+'/team',null);toast('You left the team');render()})}
function teamKick(m){const t=myTeam(me());if(!t||t.owner!==uid)return;confirmD('Remove this member from the team?',async()=>{await Rm('teams/'+t.id+'/members/'+m);await W('users/'+m+'/team',null);notify(m,'referrals','Removed from team','You were removed from team '+t.name);toast('Member removed');render()})}
V.team=function(){const u=me(),t=myTeam(u),top=A('teams').map(x=>({n:x.name,v:teamSpend(x),m:Object.keys(x.members||{}).length})).sort((a,b)=>b.v-a.v).slice(0,5);
if(!t)return card('Create a team',`<p class="sub">Build a team of friends. As leader you earn ${S3('teamPct',0)}% of every order your members place.</p>${fld('Team name','tn1')}<button class="btn" style="margin-top:12px" onclick="teamNew()">Create team</button>`,'max-width:520px;margin:0')+card('Join a team',`${fld('Team code','tj1')}<button class="btn" style="margin-top:12px" onclick="teamJoin()">Join team</button>`,'max-width:520px')+card('Top teams',T(['Team','Members','Total spending'],top.map(x=>[esc(x.n),x.m,fm(x.v)])));
const own=t.owner===u.id,ms=Object.keys(t.members||{}).map(i=>({...usr(i),id:i}));
return`<div class="grid g4">${stat('c1','Team',esc(t.name),own?'You are the leader':'Member')}${stat('c5','Members',ms.length,'Max '+S3('teamMax',20))}${stat('c3','Team spending',fm(teamSpend(t)),'All members')}${stat('c4','Leader earnings',fm(t.earned||0),S3('teamPct',0)+'% of member orders')}</div>`+card('Invite code',`<p class="sub">Share this code. Friends enter it under My Team \u2192 Join a team.</p><b style="font-size:22px;letter-spacing:.1em">${esc(t.code)}</b>`)+card('Members',T(['Member','Role','Spent','Joined',''],ms.map(m=>[esc(m.name)+' <span class="sub">@'+esc(m.username)+'</span>',m.id===t.owner?tag('Active')+' Leader':'Member',fm(spent(m.id)),day(m.at),own&&m.id!==u.id?`<button class="btn rd sm" onclick="teamKick('${m.id}')">Remove</button>`:'']))+`<button class="btn gh sm" style="margin-top:10px" onclick="teamLeave()">${own?'Disband team':'Leave team'}</button>`)+card('Top teams',T(['Team','Members','Total spending'],top.map(x=>[esc(x.n),x.m,fm(x.v)])))};
V.ateam=function(){return card('',T(['Team','Leader','Members','Spending','Leader earned','Code',''],A('teams').map(t=>[esc(t.name),esc(usr(t.owner).username),Object.keys(t.members||{}).length,fm(teamSpend(t)),fm(t.earned||0),esc(t.code),`<button class="btn rd sm" onclick="confirmD('Disband this team?',()=>disband(D.teams['${t.id}']&&{...D.teams['${t.id}'],id:'${t.id}'}))">Disband</button>`])),'margin:0')};
/* earn */
async function checkin(){const u=me(),b=+S3('dailyBonus',0),td=day(Date.now());if(!(b>0))return toast('Daily bonus is not active');if(u.lastCheckin===td)return toast('Already claimed today');const y=day(Date.now()-864e5),st=u.lastCheckin===y?(+u.streak||0)+1:1,r=+(b*(1+0.1*(Math.min(st,7)-1))).toFixed(2);await Up('users/'+u.id,{lastCheckin:td,streak:st});await wal(u.id,r,'bonus','Daily check-in (day '+st+')','promo');hist(u.id,'Daily bonus '+fm(r));toast('You earned '+fm(r));render()}
V.earn=function(){const u=me(),td=day(Date.now()),b=+S3('dailyBonus',0),t=myTeam(u),tk=A('tasks').filter(x=>x.on),subs=A('taskSubs').filter(x=>x.uid===u.id),te=sum(mine('ledger',u.id).filter(l=>l.type==='team').map(l=>+l.amt));
return`<div class="grid g4">${stat('c1','Referral earnings',fm(u.refEarn||0),(ST().ref||0)+'% of deposits')}${stat('c3','Referral balance',fm(u.refBal||0),'Withdraw or move to wallet')}${stat('c5','Promo balance',fm(u.promoBal||0),'Bonuses & tasks')}${stat('c4','Team earnings',fm(te),t?t.name:'No team yet')}</div>`+
(b>0?card('Daily check-in',`<p class="sub">Claim a bonus every day. Streak: <b>${u.streak||0}</b> day(s) \u2014 the bonus grows up to day 7.</p><button class="btn" onclick="checkin()" ${u.lastCheckin===td?'disabled':''}>${u.lastCheckin===td?'Claimed today':'Claim '+fm(b)+'+'}</button>`):'')+
`<div class="grid g2">${card('Invite friends',`<p class="sub">Your code: <b>${esc(u.ref)}</b>. Earn ${(ST().ref||0)}% of every deposit your friends make.</p><button class="btn" onclick="go('ref')">Referral dashboard & map</button>`)}${card('Your team',t?`<p class="sub"><b>${esc(t.name)}</b> \u00b7 ${Object.keys(t.members||{}).length} members${t.owner===u.id?' \u00b7 you earn '+S3('teamPct',0)+'% of member orders':''}</p><button class="btn" onclick="go('team')">Open team</button>`:`<p class="sub">Create or join a team to grow together.</p><button class="btn" onclick="go('team')">Create / join</button>`)}</div>`+
card('Tasks',T(['Task','Reward','Status',''],tk.map(x=>{const s=subs.filter(y=>y.task===x.id).sort((a,c)=>c.at-a.at)[0];return[`<b>${esc(x.title)}</b><br><span class="sub">${esc(x.desc||'')}</span>`,fm(x.reward),s?tag(s.st):'Available',!s||s.st==='Rejected'?`<button class="btn sm" onclick="taskM('${x.id}')">Do task</button>`:'']})))};
function taskM(i){const t=D.tasks[i];openMod(`<h3 style="margin:0">${esc(t.title)}</h3><p class="sub">${esc(t.desc||'')}</p>${safe(t.link)?`<a class="btn gh sm" href="${safe(t.link)}" target="_blank" rel="noopener">Open task link</a>`:''}<p class="hint">Reward: ${fm(t.reward)} promo balance after approval.</p><label>Proof (username, link or note)</label><textarea id="tp1" rows="3"></textarea><div class="row" style="margin-top:14px"><button class="btn" onclick="taskSend('${i}')">Submit</button><button class="btn gh" onclick="closeMod()">Cancel</button></div>`)}
async function taskSend(i){const p=$('#tp1').value.trim();if(p.length<3)return toast('Add your proof');if(A('taskSubs').some(x=>x.uid===uid&&x.task===i&&x.st!=='Rejected'))return toast('Already submitted');await W('taskSubs/'+id(),{uid,task:i,proof:p,st:'Pending',at:Date.now()});closeMod();toast('Submitted for review');render()}
V.atask=function(){const S=A('taskSubs').sort((a,b)=>b.at-a.at);return card('New task',`${fld('Title','nt2')}${fld('Description','nd2')}<div class="row"><div>${fld('Link (optional)','nl2','','url')}</div><div>${fld('Reward (PKR promo)','nr2','','number')}</div></div><button class="btn" style="margin-top:12px" onclick="taskAdd()">Create task</button>`,'margin:0')+card('Tasks',T(['Task','Reward','Status',''],A('tasks').map(x=>[esc(x.title),fm(x.reward),tag(x.on?'Active':'Closed'),`<button class="btn gh sm" onclick="W('tasks/${x.id}/on',${!x.on})">${x.on?'Disable':'Enable'}</button> <button class="btn rd sm" onclick="Rmc('tasks/${x.id}')">Delete</button>`])))+card('Submissions',T(['User','Task','Proof','Status','Date',''],S.map(s=>[esc(usr(s.uid).username),esc((D.tasks&&D.tasks[s.task]||{}).title||'Deleted task'),esc(s.proof),tag(s.st),day(s.at),s.st==='Pending'?`<button class="btn sm" onclick="taskReview('${s.id}',1)">Approve</button> <button class="btn rd sm" onclick="taskReview('${s.id}',0)">Reject</button>`:''])))};
function taskAdd(){const t=$('#nt2').value.trim(),r=+$('#nr2').value;if(!t||!(r>0))return toast('Enter a title and reward');W('tasks/'+id(),{title:t,desc:$('#nd2').value.trim(),link:$('#nl2').value.trim(),reward:r,on:true,at:Date.now()});toast('Task created')}
async function taskReview(i,ok){const s=D.taskSubs[i],t=D.tasks&&D.tasks[s.task];if(s.st!=='Pending')return;await W('taskSubs/'+i+'/st',ok?'Approved':'Rejected');if(ok&&t){await wal(s.uid,+t.reward,'bonus','Task reward: '+t.title,'promo')}notify(s.uid,'deposits',ok?'Task approved':'Task rejected',ok?fm(t?t.reward:0)+' was added to your promo balance.':'Your submission for "'+(t?t.title:'task')+'" was rejected.');logA((ok?'Approved':'Rejected')+' task submission by '+usr(s.uid).username);toast('Updated')}

render();
</script></body></html>
