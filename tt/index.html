const resize=(file,cb)=>{const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const s=Math.min(1,900/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.72))};i.src=r.result};r.readAsDataURL(file)};
const rip=(e,c)=>{const r=document.createElement('span'),b=c.getBoundingClientRect();r.className='rip';r.style.cssText=`width:60px;height:60px;left:${e.clientX-b.left-30}px;top:${e.clientY-b.top-30}px`;c.append(r);setTimeout(()=>r.remove(),600)};

${bl.length?`<section class="sec"><div class="wrap"><span class="eyebrow">Travel blog</span><h2>Latest guides</h2><div class="grid">${bl.map(b=>bcard(b)).join('')}</div></div></section>`:''}

function trackRes(ref){const b=A.bk().find(x=>x.ref==ref.trim().toUpperCase());if(!b)return '<div class="empty">No booking found with that reference.</div>';const i=Math.max(0,STG.indexOf(b.status)),pc=b.status=='Cancelled'?0:(i/(STG.length-1))*100;return `<div class="card cb" style="margin-top:18px"><h3>${esc(b.ref)} <span class="badge b-${b.status.replace(' ','')}">${b.status}</span></h3><p class="meta b">${esc(b.tourName)} · travel ${esc(b.travel)} · ${b.adults} adults, ${b.children} children<br>Total ${money(b.total)} · Payment <span class="badge b-${b.pay}">${b.pay}</span></p><div class="jr"><i style="width:${pc}%"></i><b style="left:${pc}%">✈️</b></div><div class="meta" style="justify-content:space-between">${STG.map(s=>`<span>${s}</span>`).join('')}</div>${b.status=='Cancelled'?'<p><b>This booking was cancelled.</b></p>':''}<h3 style="margin-top:20px">Tracking updates</h3><div class="tl">${[...(b.log||[])].reverse().map((l,j)=>`<div style="animation-delay:${j*.08}s"><b>${esc(l.m)}</b><small>${new Date(l.t).toLocaleString()}${l.loc?' · '+esc(l.loc):''}</small></div>`).join('')||'<small>No updates yet.</small>'}</div>${['Unpaid','Rejected'].includes(b.pay)?`<h3 style="margin-top:18px">Submit payment details</h3><div class="f2"><select id="pm"><option>Cash</option><option>Bank Transfer</option><option>Easypaisa</option><option>JazzCash</option></select><input id="pr" placeholder="Transaction / receipt number"><div><label>Receipt image (optional)</label><input id="pf" type="file" accept="image/*"></div></div><br><button class="btn" data-pay="${esc(b.ref)}">Submit for verification</button>`:`<p class="meta">Payment method: ${esc(b.pm||'-')} ${esc(b.pt||'')}</p>`}<br><button class="btn ghost sm" style="margin-top:12px" data-inv="${esc(b.ref)}">${ic('printer')} Invoice / print</button></div>`}

function reveal(){const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');const c=e.target.querySelector('[data-count]');if(c&&!c.dataset.d){c.dataset.d=1;const to=+c.dataset.count;let n=0;const st=Math.max(1,Math.ceil(to/40)),iv=setInterval(()=>{n=Math.min(to,n+st);c.textContent=n;if(n>=to)clearInterval(iv)},30)}io.unobserve(e.target)}}),{threshold:.1});$$('.rv').forEach((e,i)=>{e.style.transitionDelay=(i%4)*90+'ms';io.observe(e)})}
function calc(){const t=tours.find(x=>x.id==$('#bt')?.value);if(!t)return;const a=+$('#ba').value||0,c=+$('#bk').value||0,p=S.promo.find(x=>x.on!==false&&x.code==$('#bp').value.trim().toUpperCase());let tot=(a+c*.5)*px(t);if(p)tot*=1-p.pct/100;$('#tot').textContent='Estimated total: '+money(tot)+(p?` (${p.pct}% promo applied)`:'')+' · children counted at 50%';return tot}

bk.push({ref,tid:t.id,tourName:t.name,cust:u?u.email:null,name:f.value.trim(),email:em.value.trim().toLowerCase(),wa:w.value,country:c.value,adults:+a.value,children:+$('#bk').value,travel:d.value,notes:$('#bs').value,total:calc(),status:'Pending',pay:'Unpaid',date:now,log:[{t:now,m:'Booking request received'}]});sv('bookings',bk);

document.addEventListener('mouseover',e=>{const c=e.target.closest('[data-tilt]');if(c&&!c._t){c._t=1;c.addEventListener('mousemove',m=>{const b=c.getBoundingClientRect();c.style.transform=`translateY(-8px) rotateX(${(.5-(m.clientY-b.top)/b.height)*5}deg) rotateY(${((m.clientX-b.left)/b.width-.5)*5}deg)`});c.addEventListener('mouseleave',()=>c.style.transform='')}});
